<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="uploadImageTitle">Upload Image - EcoSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-page">

 <header class="topbar">
    <button id="menuToggle" class="menu-btn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <img src="images/Logo-removebg-preview-removebg-preview.png" class="logo">

    <button id="langToggle" class="lang-btn">
        <i class="fa-solid fa-globe"></i>
    </button>
</header>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
             <h3 data-i18n="dashboard">Dashboard</h3>
            <ul>
                <li onclick="window.location.href='dashboard.html'" data-i18n="dashboard"></li>
                <li onclick="window.location.href='sensors.html'" data-i18n="sensors"></li>
                <li onclick="window.location.href='Ai-prediction.html'" data-i18n="aiPrediction"></li>
       
                <li class="active" data-i18n="images"></li>
                            <li onclick="window.location.href='ai-chat.html'" data-i18n="aiChat">
        AI Chat
    </li>
            </ul>
        
        </aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- Main -->
        <main class="main-content">

            <div class="title-row">
                <h2 data-i18n="uploadImage"></h2>
                <button class="history-btn" id="goHistory" data-i18n="imageHistory"></button>
            </div>

            <div class="image-wrapper">

                <!-- Upload Card -->
                <div class="upload-card">

                    <h3 data-i18n="uploadImage"></h3>

                    <label for="imageInput" class="drop-area">
                        <span data-i18n="dragImage"></span>
                        <input type="file" id="imageInput" hidden>
                    </label>

                    <button class="upload-btn" data-i18n="upload"></button>

                    <div class="api-pill">
                        POST /images/upload
                    </div>

                </div>

                <!-- Preview Card -->
                <div class="preview-card">

                    <h3 data-i18n="imagePreview"></h3>

                    <div class="preview-box">
                        <span data-i18n="previewArea"></span>
                        <img id="previewImage" hidden>
                    </div>

                </div>

            </div>

            <footer class="footer">
                © 2026 EcoSense - Smart Agriculture Monitoring Platform
            </footer>

        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/translation.js"></script>
</body>

</html>
