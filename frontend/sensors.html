<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="sensorsPageTitle">Sensors - EcoSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-page">

    <!-- Topbar -->
    <header class="topbar">
        <button id="menuToggle" class="menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <img src="images/Logo-removebg-preview-removebg-preview.png" class="logo">

        <button id="langToggle" class="lang-btn">
            <i class="fa-solid fa-globe"></i>
        </button>
    </header>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3 data-i18n="dashboard">Dashboard</h3>
            <ul>
                <li onclick="window.location.href='dashboard.html'" data-i18n="dashboard"></li>
                <li class="active" data-i18n="sensors">Sensors</li>
                <li onclick="window.location.href='Ai-prediction.html'" data-i18n="aiPrediction"></li>
                <li onclick="window.location.href='images.html'" data-i18n="images"></li>
                <li onclick="window.location.href='ai-chat.html'" data-i18n="aiChat">
                    AI Chat
                </li>
            </ul>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content">

            <h2 data-i18n="latestSensorReading">Latest Sensor Reading</h2>

            <!-- Top Navigation (الجزء الأزرق) -->
            <div class="sensor-tabs">

                <a href="sensors.html" class="tab active" data-i18n="latestReading"></a>
                <a href="sensor-history.html" class="tab" data-i18n="history"></a>
                <a href="statistics.html" class="tab" data-i18n="statistics"></a>
                <a href="upload-data.html" class="tab" data-i18n="uploadData"></a>

            </div>

            <!-- Cards Section -->
            <div class="sensor-section">

                <div class="cards-header">
                    <h3 data-i18n="latestReadingCards"></h3>

                    <div class="header-actions">
                        <button onclick="window.location.href='Ai-prediction.html'" class="mini-btn"
                            data-i18n="predictBtn">
                            Predict (AI)
                        </button>

                        <button onclick="window.location.href='upload-data.html'" class="mini-btn light"
                            data-i18n="uploadBtn">
                            Upload Data
                        </button>
                    </div>
                </div>

                <div class="stats-cards four">

                    <div class="card">
    <p data-i18n="soilMoisture">Soil Moisture</p>
    <h3>42%</h3>
</div>

<div class="card">
    <p data-i18n="soilTemperature">Soil Temperature</p>
    <h3>24°C</h3>
</div>

<div class="card">
    <p data-i18n="airHumidity">Air Humidity</p>
    <h3>55%</h3>
</div>

<div class="card">
    <p data-i18n="soilPH">Soil pH</p>
    <h3>6.8</h3>
</div>

                </div>
            </div>

            <!-- Chart Section -->
            <div class="sensor-section">

                <h3 data-i18n="chart"></h3>

                <div class="chart-placeholder large"></div>

            </div>

        </main>

    </div>

    <footer data-i18n="footerText"></footer>
    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
