<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="loginTitle">Login - EcoSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-card">

            <h2 data-i18n="loginTitle">Login</h2>

            <p data-i18n="loginSubtitle">
                Login to access your dashboard
            </p>

            <form id="loginForm">

                <label for="email" data-i18n="emailLabel">Email</label>
                <input type="email" id="email" required data-i18n-placeholder="emailPlaceholder"
                    placeholder="Enter your email">

                <label for="password" data-i18n="passwordLabel">Password</label>
                <input type="password" id="password" required data-i18n-placeholder="passwordPlaceholder"
                    placeholder="Enter your password">

                <button type="submit" class="primary-btn" data-i18n="loginBtn">
                    Login
                </button>

                <button type="button" class="google-btn" id="googleLogin" data-i18n="googleLoginBtn">
                    Continue with Google
                </button>

            </form>

        </div>
    </div>

    <footer data-i18n="footerText">
        © 2026 EcoSense – Smart Agriculture Monitoring Platform
    </footer>

    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
