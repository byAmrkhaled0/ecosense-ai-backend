<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="imageHistoryTitle">Image History - EcoSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-page">

    <!-- Topbar (نفس AI بالظبط) -->
<header class="topbar">
    <button id="menuToggle" class="menu-btn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <img src="images/Logo-removebg-preview-removebg-preview.png" class="logo">

    <button id="langToggle" class="lang-btn">
        <i class="fa-solid fa-globe"></i>
    </button>
</header>

    <div class="dashboard-layout">

        <!-- Sidebar (نفس النظام بالظبط) -->
        <aside class="sidebar">
             <h3 data-i18n="dashboard">Dashboard</h3>
            <ul>
                <li onclick="window.location.href='dashboard.html'" data-i18n="dashboard"></li>
                <li onclick="window.location.href='sensors.html'" data-i18n="sensors"></li>
                <li onclick="window.location.href='Ai-prediction.html'" data-i18n="aiPrediction"></li>
                <li class="active" onclick="window.location.href='images.html'" data-i18n="images"></li>
                <li onclick="window.location.href='ai-chat.html'" data-i18n="aiChat">
        AI Chat
    </li>
            </ul>
        </aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- Main -->
        <main class="main-content">

            <h2 data-i18n="imageHistory"></h2>

            <div class="history-section">

                <!-- Card -->
                <div class="history-card">

                    <!-- Header -->
                    <div class="history-header">
                        <h3 data-i18n="galleryView"></h3>

                        <div class="api-pill">
                            GET /images/history
                        </div>
                    </div>

                    <!-- Gallery -->
                    <div class="gallery-grid">

                        <div class="image-item">
                            <button class="delete-btn">×</button>
                        </div>

                        <div class="image-item">
                            <button class="delete-btn">×</button>
                        </div>

                        <div class="image-item">
                            <button class="delete-btn">×</button>
                        </div>

                        <div class="image-item">
                            <button class="delete-btn">×</button>
                        </div>

                        <div class="image-item">
                            <button class="delete-btn">×</button>
                        </div>

                    </div>

                    <!-- Delete API -->
                    <div class="delete-api-pill">
                        DELETE /images/:id
                    </div>

                </div>

            </div>

        </main>

    </div>

    <footer class="footer">
        © 2026 EcoSense - Smart Agriculture Monitoring Platform
    </footer>

    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
