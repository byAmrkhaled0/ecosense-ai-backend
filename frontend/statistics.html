<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="statisticsTitle">Sensors Statistics - EcoSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-page">

<header class="topbar">
    <button id="menuToggle" class="menu-btn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <img src="images/Logo-removebg-preview-removebg-preview.png" class="logo">

    <button id="langToggle" class="lang-btn">
        <i class="fa-solid fa-globe"></i>
    </button>
</header>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
             <h3 data-i18n="dashboard">Dashboard</h3>
            <ul>
                <li onclick="window.location.href='dashboard.html'" data-i18n="dashboard"></li>
                <li class="active" onclick="window.location.href='sensors.html'" data-i18n="sensors"></li>
                <li onclick="window.location.href='Ai-prediction.html'" data-i18n="aiPrediction"></li>
                <li onclick="window.location.href='images.html'" data-i18n="images"></li>
                <li onclick="window.location.href='ai-chat.html'" data-i18n="aiChat">
        AI Chat
    </li>
            </ul>
        </aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- Main -->
        <main class="main-content">

            <h2 data-i18n="statisticsTitle"></h2>

            <!-- Tabs -->
            <div class="sensor-tabs">
                <a href="sensors.html" class="tab" data-i18n="latestReading"></a>
                <a href="sensor-history.html" class="tab" data-i18n="history"></a>
                <a href="statistics.html" class="tab active" data-i18n="statistics"></a>
                <a href="upload-data.html" class="tab" data-i18n="uploadData"></a>
            </div>

            <!-- Summary Cards -->
            <div class="sensor-section">
                <h3 data-i18n="statistics"></h3>

                <div class="stats-cards">
                    <div class="stat-card">
                        <p data-i18n="avgMoisture"></p>
                        <h2 id="avgMoisture">38%</h2>
                    </div>

                    <div class="stat-card">
                        <p data-i18n="avgTemp"></p>
                        <h2 id="avgTemp">23°C</h2>
                    </div>

                    <div class="stat-card">
                        <p data-i18n="alerts"></p>
                        <h2 id="alertsCount">3</h2>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="stats-charts">

                <div class="sensor-section half">
                    <h3 data-i18n="avgMoisture"></h3>
                    <div class="chart-box">
                        <canvas id="moistureChart"></canvas>
                    </div>
                </div>

                <div class="sensor-section half">
                    <h3 data-i18n="avgTemp"></h3>
                    <div class="chart-box">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>

            </div>

            <!-- Alerts -->
            <div class="sensor-section">
                <h3 data-i18n="alerts"></h3>

                <div class="alerts-box">
                    <div class="alert-item" data-i18n="lowMoisture"></div>
                    <div class="alert-item" data-i18n="highTemp"></div>
                </div>
            </div>

            <footer class="footer">
                © 2026 EcoSense - Smart Agriculture Monitoring Platform
            </footer>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const moistureCtx = document.getElementById('moistureChart');
        const tempCtx = document.getElementById('tempChart');

        new Chart(moistureCtx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                datasets: [{
                    data: [30, 35, 40, 38, 42],
                    borderColor: '#1f6f5c',
                    backgroundColor: 'rgba(31,111,92,0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        new Chart(tempCtx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                datasets: [{
                    data: [20, 22, 25, 23, 26],
                    borderColor: '#1f6f5c',
                    backgroundColor: 'rgba(31,111,92,0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });
    </script>
    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
