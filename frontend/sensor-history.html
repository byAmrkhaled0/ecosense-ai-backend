<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title data-i18n="sensorHistory">Sensor History - EcoSense</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-page">

  <!-- Topbar -->
<header class="topbar">
    <button id="menuToggle" class="menu-btn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <img src="images/Logo-removebg-preview-removebg-preview.png" class="logo">

    <button id="langToggle" class="lang-btn">
        <i class="fa-solid fa-globe"></i>
    </button>
</header>

  <div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
       <h3 data-i18n="dashboard">Dashboard</h3>
      <ul>
        <li onclick="window.location.href='dashboard.html'" data-i18n="dashboard"></li>
        <li class="active" onclick="window.location.href='sensors.html'" data-i18n="sensors"></li>
        <li onclick="window.location.href='Ai-prediction.html'" data-i18n="aiPrediction"></li>
        <li onclick="window.location.href='images.html'" data-i18n="images"></li>
        <li onclick="window.location.href='ai-chat.html'" data-i18n="aiChat">
        AI Chat
    </li>
      </ul>
    </aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
    <!-- Main -->
    <main class="main-content">

      <h2 data-i18n="sensorHistory"></h2>

      <!-- Tabs -->
      <div class="sensor-tabs">
        <a href="sensors.html" class="tab" data-i18n="latestReading"></a>
        <a href="history.html" class="tab active" data-i18n="history"></a>
        <a href="statistics.html" class="tab" data-i18n="statistics"></a>
        <a href="upload-data.html" class="tab" data-i18n="uploadData"></a>
      </div>

      <!-- Chart Section -->
      <div class="sensor-section">
        <h3 data-i18n="historyChartTitle"></h3>

        <div class="chart-box">
          <canvas id="historyChart"></canvas>
        </div>
      </div>

      <!-- Table Section -->
      <div class="sensor-section">
        <h3 data-i18n="historyTableTitle"></h3>

        <div class="table-wrapper">
          <table class="history-table">
            <thead>
              <tr>
                <th data-i18n="timestamp"></th>
                <th data-i18n="soilMoisture"></th>
                <th data-i18n="soilTemp"></th>
                <th data-i18n="airHumidity"></th>
                <th data-i18n="lightIntensity"></th>
                <th data-i18n="soilPH"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>2026-01-23 10:15</td>
                <td>42%</td>
                <td>24°C</td>
                <td>55%</td>
                <td>780 lx</td>
                <td>6.8</td>
              </tr>
              <tr>
                <td>2026-01-23 08:45</td>
                <td>39%</td>
                <td>23°C</td>
                <td>57%</td>
                <td>760 lx</td>
                <td>6.7</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <footer class="footer">
        © 2026 EcoSense - Smart Agriculture Monitoring Platform
      </footer>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('historyChart');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Jan 20', 'Jan 21', 'Jan 22', 'Jan 23', 'Jan 24'],
        datasets: [{
          data: [35, 38, 42, 40, 45],
          borderColor: '#1f6f5c',
          backgroundColor: 'rgba(31,111,92,0.1)',
          tension: 0.4,
          fill: true
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { display: false }
        }
      }
    });
  </script>
  <script src="js/translation.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
