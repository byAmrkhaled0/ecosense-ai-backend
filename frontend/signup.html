<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="signupTitle">Sign Up - EcoSense</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-body">

    <div id="navbar-container"></div>

    <section class="auth-section">

        <div class="auth-card">

            <h2 data-i18n="createAccount">
                Create your account
            </h2>

            <p data-i18n="signupDesc">
                Sign up to start monitoring your agricultural data
            </p>

            <form id="signupForm">

                <div class="row">
                    <input type="text" placeholder="First Name" data-i18n-placeholder="firstName" required>
                    <input type="text" placeholder="Last Name" data-i18n-placeholder="lastName" required>
                </div>

                <input type="email" id="email" placeholder="Email" data-i18n-placeholder="email" required>
                <input type="tel" placeholder="Phone Number" data-i18n-placeholder="phone" required>
                <input type="text" placeholder="Address" data-i18n-placeholder="address" required>
                <input type="password" placeholder="Password" data-i18n-placeholder="password" required>
                <input type="password" placeholder="Confirm Password" data-i18n-placeholder="confirmPassword" required>

                <button type="submit" class="auth-btn" data-i18n="register">
                    Register
                </button>

            </form>

        </div>

    </section>

    <footer class="auth-footer">
        <span data-i18n="footerText">
            © 2026 EcoSense – Smart Agriculture Monitoring Platform
        </span>
    </footer>

    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
